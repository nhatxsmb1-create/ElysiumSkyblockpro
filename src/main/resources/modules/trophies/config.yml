# Trophy Hall: Mini Boss của Island Event có tỉ lệ rơi Trophy.
# Đặt trophy lên đảo để trưng bày - mỗi trophy có một buff và bonus riêng!
# Tháo trophy xuống sẽ mất buff của trophy đó ngay lập tức.

enabled: true

# Tỉ lệ rơi trophy khi đánh bại Mini Boss (%).
drop-chance: 35.0

# Danh sách trophy - mỗi event một loại.
# material: vật phẩm hiển thị (nên dùng PLAYER_HEAD).
# texture: (tùy chọn) base64 texture cho đầu custom - bỏ trống để dùng đầu thường.
# buffs.potions: Hiệu ứng thuốc áp cho người chơi đang ở trên đảo (Định dạng: TÊN_HIỆU_ỨNG:cấp).
# buffs.bonuses: Buff nhân thêm cho đảo (ví dụ crop-growth, mob-drops).
trophies:
  tornado:
    name: 'Lốc Xoáy Tàn Phá'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      potions:
        - 'FAST_DIGGING:1'
  volcano:
    name: 'Trái Tim Núi Lửa'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      potions:
        - 'FIRE_RESISTANCE:1'
  ancient-tree:
    name: 'Dryad Cổ Đại'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      bonuses:
        crop-growth: 0.05
  celestial:
    name: 'Mảnh Thiên Thể'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      potions:
        - 'NIGHT_VISION:1'
  invasion:
    name: 'Kẻ Xâm Lược'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      bonuses:
        mob-drops: 0.05
  meteor-shower:
    name: 'Thiên Thạch Rực Cháy'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      potions:
        - 'FAST_DIGGING:2'
  space-rift:
    name: 'Cổng Không Gian'
    material: 'PLAYER_HEAD'
    texture: ''
    buffs:
      potions:
        - 'SPEED:1'
      bonuses:
        crop-growth: 0.05
