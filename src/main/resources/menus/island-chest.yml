title: '&lRương Đảo'
previous-menu: true

pattern:
  - '# # # # # # # # #'
  - '# $ @ @ @ @ @ $ #'
  - '# $ @ @ @ @ @ $ #'
  - '# $ @ @ @ @ @ $ #'
  - '# $ @ @ @ @ @ $ #'
  - '# # % # * # ^ # #'

slots: '@'
previous-page: '%'
current-page: '*'
next-page: '^'

items:
  '@':
    valid-page:
      type: STORAGE_MINECART
      name: '&eTrang #{0}'
      lore:
        - '&eKích Thước: &7{1}'
    invalid-page:
      type: MINECART
      name: '&f '
  '%':
    type: PAPER
    name: '{0}Trang Trước'
  '*':
    type: DOUBLE_PLANT
    name: '&aTrang Hiện Tại'
    lore:
      - '&7Trang {0}'
  '^':
    type: PAPER
    name: '{0}Trang Sau'
  '#':
    type: RAILS
    name: '&f '

sounds:
  '@':
    type: CHEST_OPEN
    volume: 0.8
    pitch: 1