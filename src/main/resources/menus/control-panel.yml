title: '&lBảng Điều Khiển Đảo'
previous-menu: true

pattern:
  - '2 2 2 2 2 2 2 2 2'
  - '# ! # @ # $ # % #'
  - '_ # ^ # & # * # 1'
  - '# ~ # = # - # + #'
  - '2 2 2 2 2 2 2 2 2'

members: '+'
settings: '@'
visitors: '-'

items:
  '!':
    type: SIGN
    name: '&eDịch Chuyển'
    lore:
      - '&7Dịch chuyển về đảo của bạn.'
  '@':
    type: DIODE
    name: '&eCài Đặt Đảo'
    lore:
      - '&7Quản lý các cài đặt của đảo bạn.'
  '$':
    type: ENDER_PEARL
    name: '&eQuyền Hạn Đảo'
    lore:
      - '&7Quản lý quyền hạn trong đảo của bạn.'
  '%':
    type: GRASS
    name: '&eSinh Quản Đảo'
    lore:
      - '&7Thay đổi sinh quản của đảo bạn.'
  '_':
    type: EMERALD
    name: '&eNgân Hàng Đảo'
    lore:
      - '&7Mở ngân hàng của đảo bạn.'
  '^':
    type: GOLD_INGOT
    name: '&eNâng Cấp Đảo'
    lore:
      - '&7Nâng cấp chỉ số đảo của bạn!'
  '&':
    type: BEACON
    name: '&eBảng Xếp Hạng Đảo'
    lore:
      - '&7Xem đảo nào là tốt nhất trên máy chủ!'
  '*':
    type: PAPER
    name: '&eNhiệm Vụ Đảo'
    lore:
      - '&7Hoàn thành nhiệm vụ và nhận phần thưởng!'
  '1':
    type: SMOOTH_BRICK
    name: '&eSố Lượng Khối Đảo'
    lore:
      - '&7Xem tất cả các khối trên đảo của bạn!'
  '~':
    type: BARRIER
    name: '&eGiải Tán Đảo'
    lore:
      - '&7Giải tán đảo của bạn.'
      - '&cHành động này không thể khôi phục!'
  '=':
    type: CHEST
    name: '&eRương Đảo'
    lore:
      - '&7Mở rương chung của đảo.'
  '-':
    type: SKULL_ITEM
    name: '&eKhách Thăm Đảo'
    lore:
      - '&7Xem tất cả khách thăm của đảo.'
  '+':
    type: SKULL_ITEM
    data: 3
    name: '&eThành Viên Đảo'
    lore:
      - '&7Quản lý thành viên của đảo.'
  '2':
    type: STAINED_GLASS_PANE
    data: 15
    name: '&f'

